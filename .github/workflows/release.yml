name: Release KH VPN

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis, mis. 2.2.0 (kosong = versi otomatis). Dipakai tab Rilis di GH-DROP."
        required: false
        default: ""
      dnstt_ref:
        description: "Revisi dnstt (hash commit atau tag) yang dibuild. Kosong = terbaru. Isi bila server memakai dnstt versi lama."
        required: false
        default: ""

permissions:
  contents: write

# Batalkan build lama pada branch/PR yang sama saat ada push baru
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  XRAY_VERSION: "v1.8.24"

jobs:
  # ------------------------------------------------------------------
  # 1) Binary native per ABI: dnstt-client (Go) + tun2socks (badvpn, C)
  # ------------------------------------------------------------------
  natives:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: armeabi-v7a, goarch: arm,   goarm: "7" }
          - { abi: arm64-v8a,   goarch: arm64, goarm: "" }
          - { abi: x86,         goarch: "386", goarm: "" }
          - { abi: x86_64,      goarch: amd64, goarm: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build dnstt-client (${{ matrix.abi }})
        env:
          DNSTT_REF: ${{ github.event.inputs.dnstt_ref }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"; mkdir -p "$OUT"
          rm -rf /tmp/dnstt /tmp/dnstt-plain
          # Catatan: bamsoftware memakai dumb HTTP transport yang menolak --depth 1
          git clone https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt \
            || git clone --depth 1 https://repo.or.cz/dnstt.git /tmp/dnstt
          if [ -n "${DNSTT_REF:-}" ]; then git -C /tmp/dnstt checkout "$DNSTT_REF"; fi
          DNSTT_VER="$(git -C /tmp/dnstt log -1 --format='%h %cs')"
          echo "dnstt revisi: $DNSTT_VER"
          cp -r /tmp/dnstt /tmp/dnstt-plain
          if python3 tools/patch_dnstt.py /tmp/dnstt && (cd /tmp/dnstt && go build -trimpath -ldflags="-s -w" -o "$OUT/libdnstt.so" ./dnstt-client); then
            echo "dnstt: build dipatch, mendukung -type TXT|NULL"
          else
            echo "::warning::Patch dnstt gagal, memakai dnstt asli (hanya TXT)"
            (cd /tmp/dnstt-plain && go build -trimpath -ldflags="-s -w" -o "$OUT/libdnstt.so" ./dnstt-client)
          fi
          echo "$DNSTT_VER" > "$OUT/dnstt-version.txt"
          file "$OUT/libdnstt.so"

      # Xray-core untuk metode V2Ray (vmess / vless / trojan). Opsional: kalau gagal, APK tetap jadi
      # dan metode V2Ray menampilkan pesan "Binary Xray tidak ada".
      - name: Build xray-core (${{ matrix.abi }})
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"; mkdir -p "$OUT"
          rm -rf /tmp/xray
          git clone --depth 1 --branch "$XRAY_VERSION" https://github.com/XTLS/Xray-core.git /tmp/xray
          cd /tmp/xray
          go build -trimpath -ldflags="-s -w -buildid=" -o "$OUT/libxray.so" ./main
          file "$OUT/libxray.so"

      - name: Build tun2socks (badvpn upstream + patch fd, dengan udpgw)
        id: t2s
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.abi }}" in
            armeabi-v7a) TRIPLE=armv7a-linux-androideabi23 ;;
            arm64-v8a)   TRIPLE=aarch64-linux-android23 ;;
            x86)         TRIPLE=i686-linux-android23 ;;
            x86_64)      TRIPLE=x86_64-linux-android23 ;;
          esac
          rm -rf /tmp/badvpn /tmp/t2s-build
          git clone --depth 1 https://github.com/ambrop72/badvpn.git /tmp/badvpn
          python3 tools/patch_tun2socks.py /tmp/badvpn

          # badvpn mendeteksi platform lewat CMAKE_SYSTEM_NAME == Linux, sedangkan toolchain NDK
          # memakai "Android". Perlakukan Android sebagai Linux (epoll, TAP/fd, dsb).
          echo "--- deteksi platform di CMakeLists badvpn (sebelum patch) ---"
          grep -rn "CMAKE_SYSTEM_NAME" /tmp/badvpn --include=CMakeLists.txt --include=*.cmake || true
          find /tmp/badvpn -name CMakeLists.txt -o -name '*.cmake' | xargs sed -i -E \
            's/CMAKE_SYSTEM_NAME[[:space:]]+(STREQUAL|MATCHES)[[:space:]]+"?Linux"?/CMAKE_SYSTEM_NAME MATCHES "Linux|Android"/g'
          echo "--- sesudah patch ---"
          grep -rn "CMAKE_SYSTEM_NAME" /tmp/badvpn --include=CMakeLists.txt --include=*.cmake || true

          # pembungkus penerima fd TUN
          "$TC/$TRIPLE-clang" -O2 -pie -Wl,-z,max-page-size=16384 native/t2sfd.c -o "$OUT/libt2sfd.so"

          cmake -S /tmp/badvpn -B /tmp/t2s-build \
            -DBUILD_NOTHING_BY_DEFAULT=1 -DBUILD_TUN2SOCKS=1 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-pie -Wl,-z,max-page-size=16384"
          cmake --build /tmp/t2s-build -j"$(nproc)"
          BIN="$(find /tmp/t2s-build -type f -name 'badvpn-tun2socks' | head -1)"
          test -n "$BIN"
          cp "$BIN" "$OUT/libtun2socks.so"

          # Verifikasi: binary WAJIB punya udpgw dan hasil patch fd, kalau tidak build ini gagal
          strings -a "$OUT/libtun2socks.so" | grep -q -- "--udpgw-remote-server-addr"
          strings -a "$OUT/libtun2socks.so" | grep -q "T2S_TUNFD"
          file "$OUT/libtun2socks.so" "$OUT/libt2sfd.so"
          # Info: V2Ray memakai SOCKS5 UDP, bukan udpgw
          if strings -a "$OUT/libtun2socks.so" | grep -q -- "--socks5-udp"; then echo "tun2socks: --socks5-udp tersedia"; else echo "::warning::tun2socks tanpa --socks5-udp: UDP/DNS metode V2Ray tidak akan lewat tunnel"; fi

      # Cadangan: binary tun2socks dari APK lama (hanya armeabi-v7a)
      - name: Pakai tun2socks lama sebagai cadangan
        if: steps.t2s.outcome != 'success'
        run: |
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"
          rm -f "$OUT/libt2sfd.so"
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            cp native/legacy/armeabi-v7a/libtun2socks.so "$OUT/libtun2socks.so"
            echo "::warning::tun2socks ${{ matrix.abi }} gagal dibuild, memakai binary lama dari APK 2023"
          else
            echo "::error::tun2socks ${{ matrix.abi }} gagal dibuild dan tidak ada cadangan. APK untuk ABI ini tidak akan bisa tersambung."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.abi }}
          path: out/${{ matrix.abi }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) dnstt-server hasil patch (untuk menjalankan mode NULL di VPS)
  # ------------------------------------------------------------------
  dnstt-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build dnstt-server (linux amd64 + arm64)
        env:
          DNSTT_REF: ${{ github.event.inputs.dnstt_ref }}
        run: |
          set -euo pipefail
          rm -rf /tmp/dnstt
          git clone https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt \
            || git clone --depth 1 https://repo.or.cz/dnstt.git /tmp/dnstt
          if [ -n "${DNSTT_REF:-}" ]; then git -C /tmp/dnstt checkout "$DNSTT_REF"; fi
          python3 tools/patch_dnstt.py /tmp/dnstt
          mkdir -p out
          cd /tmp/dnstt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/dnstt-server-linux-amd64" ./dnstt-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/dnstt-server-linux-arm64" ./dnstt-server
      - uses: actions/upload-artifact@v4
        with:
          name: dnstt-server-patched
          path: out/

  # ------------------------------------------------------------------
  # 3) APK
  # ------------------------------------------------------------------
  apk:
    needs: natives
    # Tetap jalan walau sebagian ABI gagal; APK dibuat hanya untuk ABI yang binary-nya lengkap
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives-dl

      - name: Pasang binary native ke jniLibs
        run: |
          for d in natives-dl/natives-*; do
            abi="${d##*natives-}"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$d"/*.so "app/src/main/jniLibs/$abi/"
            if [ -f "$d/dnstt-version.txt" ]; then mkdir -p app/src/main/assets; cp "$d/dnstt-version.txt" app/src/main/assets/dnstt-version.txt; fi
          done
          find app/src/main/jniLibs -type f | sort

          # Hanya ABI yang punya libdnstt.so + libtun2socks.so yang dimasukkan ke APK
          ABIS=""
          for d in app/src/main/jniLibs/*/; do
            abi="$(basename "$d")"
            if [ -f "$d/libdnstt.so" ] && [ -f "$d/libtun2socks.so" ]; then
              ABIS="${ABIS:+$ABIS,}$abi"
            else
              echo "::warning::ABI $abi tidak lengkap, dilewati dari APK"
              rm -rf "$d"
            fi
          done
          if [ -z "$ABIS" ]; then echo "::error::Tidak ada ABI yang berhasil dibuild"; exit 1; fi
          echo "KH_ABIS=$ABIS" >> "$GITHUB_ENV"
          echo "ABI di APK: $ABIS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Keystore rilis (opsional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            [ -n "$KS_PASS" ] && echo "KH_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            [ -n "$KEY_ALS" ] && echo "KH_KEY_ALIAS=$KEY_ALS" >> "$GITHUB_ENV"
            [ -n "$KEY_PASS" ] && echo "KH_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Memakai keystore dari secrets"
          else
            echo "::notice::Secret KEYSTORE_BASE64 tidak ada, memakai keystore bawaan repo (hanya untuk uji coba/sideload pribadi)"
          fi

      - name: Versi
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"
          else V="2.2.0-${GITHUB_RUN_NUMBER}"; fi
          [[ "$V" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::Versi tidak valid: $V"; exit 1; }
          echo "KH_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "KH_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle --no-daemon :app:assembleRelease

      - name: Kumpulkan APK (per ABI + universal)
        run: |
          mkdir -p dist
          ls -la app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$f" .apk | sed -E 's/^app-//; s/-release$//')"
            cp "$f" "dist/KH-VPN-${KH_VERSION_NAME}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Verifikasi tanda tangan APK
        continue-on-error: true
        run: |
          AS="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          for f in dist/*.apk; do
            echo "== $f"
            "$AS" verify --print-certs "$f" | head -3
          done

      - uses: actions/upload-artifact@v4
        with:
          name: KH-VPN-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      # Setiap push ke main (atau tag v*) otomatis menjadi GitHub Release yang bisa diunduh siapa pun
      - name: Rilis GitHub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KH_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: KH VPN ${{ env.KH_VERSION_NAME }}
          make_latest: true
          body: |
            **Pilih APK sesuai HP:**
            - `arm64-v8a`: hampir semua HP 64-bit (sekitar 2017 ke atas)
            - `armeabi-v7a`: HP 32-bit / lama
            - `x86_64` / `x86`: emulator dan Chromebook
            - `universal`: semua arsitektur, ukuran paling besar

            Build release (R8 + shrink), ditandatangani keystore bawaan repo untuk sideload pribadi.
            Hash ada di `SHA256SUMS.txt`.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt